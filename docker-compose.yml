services:
  postgres:
    image: postgres:16-alpine
    container_name: nimbus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nimbus
      POSTGRES_PASSWORD: nimbus
      POSTGRES_DB: nimbus_drive
    ports:
      - "5432:5432"
    volumes:
      - nimbus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nimbus -d nimbus_drive"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nimbus-pgdata:
